name: Build IO APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -o '*.zip' -x ".github/*" || true
      - name: Patch permissions
        run: |
          if [ -f buildozer.spec ]; then
            sed -i 's/^#* *android.permissions *=.*/android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE/' buildozer.spec
            grep -q '^android.permissions' buildozer.spec || echo 'android.permissions = READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE' >> buildozer.spec
          fi
      - name: Patch UI sizes
        run: |
          python3 - <<'PYEOF'
          s = open('main.py', encoding='utf-8').read()
          old = "sm.add_widget(self._main_screen())"
          if old in s:
              s = s.replace(old, "mainscr = Screen(name='main'); mainscr.add_widget(self._main_screen()); sm.add_widget(mainscr)")
          s = s.replace("tp.tab_width = 160", "tp.tab_width = 240")
          s = s.replace("multiline=False, size_hint=(1, None), height=36",
                        "multiline=False, size_hint=(1, None), height=52, font_size='17sp'")
          s = s.replace("size_hint=(1, None), height=24, halign='left'",
                        "size_hint=(1, None), height=34, font_size='15sp', halign='left'")
          s = s.replace("size_hint=(1, None), height=24)", "size_hint=(1, None), height=34)")
          s = s.replace("Label(text='журнал обучения:', size_hint=(1, None),\n                height=28, halign='left')",
                        "Label(text='журнал обучения:', size_hint=(1, None),\n                height=34, font_size='15sp', halign='left')")
          open('main.py', 'w', encoding='utf-8').write(s)
          PYEOF
      - name: Diagnostic wrapper
        run: |
          if [ -f main.py ] && ! [ -f real_main.py ]; then
          mv main.py real_main.py
          cat > main.py <<'PYEOF'
          import sys, os, traceback
          _here = os.path.dirname(os.path.abspath(__file__))
          def _save(text):
              for p in ("/sdcard/Download/io_crash.log", os.path.join(_here, "io_crash.log")):
                  try:
                      open(p, "w", encoding="utf-8").write(text)
                  except Exception:
                      pass
          try:
              os.chdir(_here)
              _g = {"__name__": "__main__"}
              _p_py = os.path.join(_here, "real_main.py")
              _p_pyc = os.path.join(_here, "real_main.pyc")
              if os.path.exists(_p_py):
                  _g["__file__"] = _p_py
                  exec(compile(open(_p_py, encoding="utf-8").read(), _p_py, "exec"), _g)
              elif os.path.exists(_p_pyc):
                  _g["__file__"] = _p_pyc
                  from importlib.machinery import SourcelessFileLoader
                  _code = SourcelessFileLoader("real_main", _p_pyc).get_code("real_main")
                  exec(_code, _g)
              else:
                  raise FileNotFoundError("real_main not found in app dir")
          except BaseException:
              _tb = traceback.format_exc()
              try:
                  _tb = _tb + "\n--- files in app dir ---\n" + "\n".join(os.listdir(_here))
              except Exception:
                  pass
              _save(_tb)
              try:
                  from kivy.app import App
                  from kivy.uix.label import Label
                  class _CrashApp(App):
                      def build(self):
                          lbl = Label(text=_tb, font_size="12sp", halign="left", valign="top")
                          lbl.bind(size=lambda *a: setattr(lbl, "text_size", lbl.size))
                          return lbl
                  _CrashApp().run()
              except Exception:
                  pass
              raise
          PYEOF
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip autoconf libtool pkg-config zlib1g-dev openjdk-17-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
      - name: Install buildozer
        run: pip install buildozer==1.5.0 cython==0.29.33
      - name: Build APK
        run: yes | buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: io-apk
          path: bin/*.apk
